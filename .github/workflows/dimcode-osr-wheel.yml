name: DimCode OSR wheel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Workflow mode
        type: choice
        options:
          - regression
          - prebuilt
          - cache-smoke
        default: regression
        required: true
      runner_profile:
        description: Prebuilt runner profile; ignored in regression mode
        type: choice
        options:
          - release
          - standard-probe
          - standard-resume
        default: release
        required: true
      target:
        description: Single target used by standard-resume; release requires all
        type: choice
        options:
          - all
          - darwin-arm64
          - darwin-x64
          - win32-x64
          - linux-x64
        default: all
        required: true

concurrency:
  group: dimcode-osr-wheel-${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode || 'regression' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TOOLS_SHA: 3f2c00792ab46cf9b9ab492a3f0a67c8f5d303be
  ELECTRON_OUT_DIR: Testing
  EVM_CONFIG: ${{ github.workspace }}/.electron-build-tools-config
  EVM_CURRENT_FILE: ${{ github.workspace }}/.electron-build-tools-current
  GN_EXTRA_ARGS: 'symbol_level=0 override_electron_version="41.7.1"'

jobs:
  build-and-test:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'regression'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            target-cpu: arm64
          - name: Linux x64
            runner: ubuntu-24.04
            target-cpu: x64
          - name: Windows x64
            runner: windows-2022
            target-cpu: x64

    steps:
      - name: Check out patched Electron
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          path: electron-root/src/electron

      - name: Free macOS disk space
        if: runner.os == 'macOS'
        uses: ./electron-root/src/electron/.github/actions/free-space-macos

      - name: Free Linux disk space
        if: runner.os == 'Linux'
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h

      - name: Configure build-tools Git settings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global branch.autosetuprebase always
          git config --global core.fscache true
          git config --global core.longpaths true
          git config --global core.preloadindex true

      - name: Assert Windows VS 2022 toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "${env:GITHUB_WORKSPACE}/electron-root/src/electron/script/dimcode/assert-windows-toolchain.ps1"'

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 22.21.x

      - name: Install pinned Electron build tools
        shell: bash
        run: npm install --global @electron/build-tools

      - name: Initialize Electron build
        shell: bash
        run: |
          e init dimcode-ci \
            --root="${GITHUB_WORKSPACE}/electron-root" \
            --import=testing \
            --out=Testing \
            --target-cpu="${{ matrix.target-cpu }}" \
            --remote-build=none \
            --use-https \
            --fork="${GITHUB_REPOSITORY}" \
            --force
          e sync --no-history
          test "$(git -C "${GITHUB_WORKSPACE}/electron-root/src/electron" rev-parse HEAD)" = "${GITHUB_SHA}"
          git -C "${GITHUB_WORKSPACE}/electron-root/src/electron" pack-refs --all

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: sudo "${GITHUB_WORKSPACE}/electron-root/src/build/install-build-deps.sh" --no-prompt

      - name: Build Electron and Node headers
        shell: bash
        run: |
          e build --no-remote
          e build --target electron:node_headers --no-remote

      - name: Prepare Windows Node import library
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/electron-root/src/out/Testing/gen/node_headers/Release"
          cp "${GITHUB_WORKSPACE}/electron-root/src/out/Testing/electron.lib" \
            "${GITHUB_WORKSPACE}/electron-root/src/out/Testing/gen/node_headers/Release/node.lib"

      - name: Run OSR wheel regression spec
        shell: bash
        working-directory: electron-root/src/electron
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            xvfb-run -a npm run test -- -g='retargets a wheel gesture after an unconsumed direction change'
          else
            npm run test -- -g='retargets a wheel gesture after an unconsumed direction change'
          fi

  prebuilt:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'prebuilt'
    uses: ./.github/workflows/dimcode-prebuilt-release.yml
    with:
      runner_profile: ${{ inputs.runner_profile }}
      target: ${{ inputs.target }}
    permissions:
      contents: write
      id-token: write
      attestations: write

  sccache-prime:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'cache-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SCCACHE_GHA_ENABLED: 'on'
      SCCACHE_GHA_VERSION: dimcode-electron-cache-smoke-${{ github.run_id }}
    steps:
      - name: Install pinned sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0

      - name: Prime GitHub Actions compiler cache
        shell: bash
        run: |
          printf '%s\n' 'int main() { return 0; }' > "${GITHUB_WORKSPACE}/dimcode-sccache-smoke.cc"
          sccache --zero-stats
          sccache clang++ -c "${GITHUB_WORKSPACE}/dimcode-sccache-smoke.cc" -o "${RUNNER_TEMP}/dimcode-sccache-smoke.o"
          stats="$(sccache --show-stats --stats-format json)"
          jq . <<< "${stats}"
          test "$(jq '[.stats.cache_hits.counts[]] | add // 0' <<< "${stats}")" = 0
          test "$(jq '[.stats.cache_misses.counts[]] | add // 0' <<< "${stats}")" = 1

      - name: Exercise resumable timeout boundary
        id: timeout
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: sleep 90

      - name: Require controlled timeout continuation
        shell: bash
        env:
          TIMEOUT_OUTCOME: ${{ steps.timeout.outcome }}
        run: test "${TIMEOUT_OUTCOME}" = failure

  windows-toolchain:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'cache-smoke'
    runs-on: windows-2022
    timeout-minutes: 5
    env:
      SCCACHE_GHA_ENABLED: 'on'
      SCCACHE_GHA_VERSION: dimcode-electron-windows-cache-smoke-${{ github.run_id }}
    steps:
      - name: Check out toolchain assertion
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          path: electron-root/src/electron

      - name: Assert Windows VS 2022 toolchain
        shell: pwsh
        run: '& "${env:GITHUB_WORKSPACE}/electron-root/src/electron/script/dimcode/assert-windows-toolchain.ps1"'

      - name: Install pinned sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0

      - name: Prime Windows compiler cache
        shell: bash
        run: |
          printf '%s\n' 'int main() { return 0; }' > "${GITHUB_WORKSPACE}/dimcode-sccache-windows-smoke.cc"
          sccache --zero-stats
          sccache clang++ -c "${GITHUB_WORKSPACE}/dimcode-sccache-windows-smoke.cc" -o "${RUNNER_TEMP}/dimcode-sccache-windows-smoke.obj"
          stats="$(sccache --show-stats --stats-format json)"
          jq . <<< "${stats}"
          test "$(jq '[.stats.cache_hits.counts[]] | add // 0' <<< "${stats}")" = 0
          test "$(jq '[.stats.cache_misses.counts[]] | add // 0' <<< "${stats}")" = 1
          test "$(jq '([.stats.cache_errors.counts[]] | add // 0) + .stats.cache_timeouts + .stats.cache_read_errors + .stats.cache_write_errors' <<< "${stats}")" = 0

  windows-cache-hit:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'cache-smoke'
    needs: windows-toolchain
    runs-on: windows-2022
    timeout-minutes: 5
    env:
      SCCACHE_GHA_ENABLED: 'on'
      SCCACHE_GHA_VERSION: dimcode-electron-windows-cache-smoke-${{ github.run_id }}
    steps:
      - name: Install pinned sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0

      - name: Require a cross-job Windows compiler cache hit
        shell: bash
        run: |
          printf '%s\n' 'int main() { return 0; }' > "${GITHUB_WORKSPACE}/dimcode-sccache-windows-smoke.cc"
          sccache --zero-stats
          sccache clang++ -c "${GITHUB_WORKSPACE}/dimcode-sccache-windows-smoke.cc" -o "${RUNNER_TEMP}/dimcode-sccache-windows-smoke.obj"
          stats="$(sccache --show-stats --stats-format json)"
          jq . <<< "${stats}"
          test "$(jq '[.stats.cache_hits.counts[]] | add // 0' <<< "${stats}")" = 1
          test "$(jq '[.stats.cache_misses.counts[]] | add // 0' <<< "${stats}")" = 0
          test "$(jq '([.stats.cache_errors.counts[]] | add // 0) + .stats.cache_timeouts + .stats.cache_read_errors + .stats.cache_write_errors' <<< "${stats}")" = 0

  sccache-hit:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'cache-smoke'
    needs: sccache-prime
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SCCACHE_GHA_ENABLED: 'on'
      SCCACHE_GHA_VERSION: dimcode-electron-cache-smoke-${{ github.run_id }}
    steps:
      - name: Install pinned sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0

      - name: Require a cross-job compiler cache hit
        shell: bash
        run: |
          printf '%s\n' 'int main() { return 0; }' > "${GITHUB_WORKSPACE}/dimcode-sccache-smoke.cc"
          sccache --zero-stats
          sccache clang++ -c "${GITHUB_WORKSPACE}/dimcode-sccache-smoke.cc" -o "${RUNNER_TEMP}/dimcode-sccache-smoke.o"
          stats="$(sccache --show-stats --stats-format json)"
          jq . <<< "${stats}"
          test "$(jq '[.stats.cache_hits.counts[]] | add // 0' <<< "${stats}")" = 1
          test "$(jq '[.stats.cache_misses.counts[]] | add // 0' <<< "${stats}")" = 0
