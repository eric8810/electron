name: DimCode Electron prebuilt

on:
  workflow_call:
    inputs:
      runner_profile:
        description: Runner profile used for the platform build matrix
        type: string
        default: release
        required: false
      target:
        description: Single target used by standard-resume; release requires all
        type: string
        default: all
        required: false
  workflow_dispatch:
    inputs:
      runner_profile:
        description: Runner profile used for the platform build matrix
        type: choice
        options:
          - release
          - standard-probe
          - standard-resume
        default: release
        required: true
      target:
        description: Single target used by standard-resume; release requires all
        type: choice
        options:
          - all
          - darwin-arm64
          - darwin-x64
          - win32-x64
          - linux-x64
        default: all
        required: true
  push:
    tags:
      - 'dimcode-v41.7.1-r*'

concurrency:
  group: dimcode-electron-prebuilt-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUILD_TOOLS_SHA: 3f2c00792ab46cf9b9ab492a3f0a67c8f5d303be
  ELECTRON_OUT_DIR: Release
  EVM_CONFIG: ${{ github.workspace }}/.electron-build-tools-config
  EVM_CURRENT_FILE: ${{ github.workspace }}/.electron-build-tools-current
  GN_EXTRA_ARGS: 'symbol_level=0 override_electron_version="41.7.1"'

jobs:
  configure:
    name: Configure prebuilt runners
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      prime_matrix: ${{ steps.matrix.outputs.prime_matrix }}
    env:
      RUNNER_PROFILE: ${{ github.event_name == 'push' && 'release' || inputs.runner_profile }}
      TARGET: ${{ github.event_name == 'push' && 'all' || inputs.target }}
      RUNNER_DARWIN_ARM64: ${{ vars.DIMCODE_ELECTRON_RUNNER_DARWIN_ARM64 }}
      RUNNER_DARWIN_X64: ${{ vars.DIMCODE_ELECTRON_RUNNER_DARWIN_X64 }}
      RUNNER_WIN32_X64: ${{ vars.DIMCODE_ELECTRON_RUNNER_WIN32_X64 }}
      RUNNER_LINUX_X64: ${{ vars.DIMCODE_ELECTRON_RUNNER_LINUX_X64 }}
    steps:
      - name: Resolve build matrix
        id: matrix
        shell: bash
        run: |
          case "${RUNNER_PROFILE}" in
            standard-probe)
              matrix="$(jq -cn '{include:[
                {runner:"macos-15",platform:"darwin",manifest_platform:"mac",arch:"arm64"},
                {runner:"macos-15-intel",platform:"darwin",manifest_platform:"mac",arch:"x64"},
                {runner:"windows-2022",platform:"win32",manifest_platform:"win",arch:"x64"},
                {runner:"ubuntu-24.04",platform:"linux",manifest_platform:"linux",arch:"x64"}
              ]}')"
              ;;
            standard-resume)
              case "${TARGET}" in
                darwin-arm64)
                  matrix='{"include":[{"runner":"macos-15","platform":"darwin","manifest_platform":"mac","arch":"arm64","prime_minutes":205}]}'
                  ;;
                darwin-x64)
                  matrix='{"include":[{"runner":"macos-15-intel","platform":"darwin","manifest_platform":"mac","arch":"x64","prime_minutes":250}]}'
                  ;;
                win32-x64)
                  matrix='{"include":[{"runner":"windows-2022","platform":"win32","manifest_platform":"win","arch":"x64","prime_minutes":155}]}'
                  ;;
                linux-x64)
                  matrix='{"include":[{"runner":"ubuntu-24.04","platform":"linux","manifest_platform":"linux","arch":"x64","prime_minutes":225}]}'
                  ;;
                all)
                  matrix='{"include":[{"runner":"ubuntu-24.04","platform":"linux","manifest_platform":"linux","arch":"x64","prime_minutes":225}]}'
                  ;;
                *)
                  echo "standard-resume requires one supported target, got: ${TARGET}" >&2
                  exit 1
                  ;;
              esac
              ;;
            release)
              if [[ "${TARGET}" != all ]]; then
                echo "release profile requires target=all, got: ${TARGET}" >&2
                exit 1
              fi
              missing=()
              [[ -n "${RUNNER_DARWIN_ARM64}" ]] || missing+=(DIMCODE_ELECTRON_RUNNER_DARWIN_ARM64)
              [[ -n "${RUNNER_DARWIN_X64}" ]] || missing+=(DIMCODE_ELECTRON_RUNNER_DARWIN_X64)
              [[ -n "${RUNNER_WIN32_X64}" ]] || missing+=(DIMCODE_ELECTRON_RUNNER_WIN32_X64)
              [[ -n "${RUNNER_LINUX_X64}" ]] || missing+=(DIMCODE_ELECTRON_RUNNER_LINUX_X64)
              if (( ${#missing[@]} > 0 )); then
                printf 'missing required release runner variables: %s\n' "${missing[*]}" >&2
                exit 1
              fi
              matrix="$(jq -cn \
                --arg darwin_arm64 "${RUNNER_DARWIN_ARM64}" \
                --arg darwin_x64 "${RUNNER_DARWIN_X64}" \
                --arg win32_x64 "${RUNNER_WIN32_X64}" \
                --arg linux_x64 "${RUNNER_LINUX_X64}" \
                '{include:[
                  {runner:$darwin_arm64,platform:"darwin",manifest_platform:"mac",arch:"arm64"},
                  {runner:$darwin_x64,platform:"darwin",manifest_platform:"mac",arch:"x64"},
                  {runner:$win32_x64,platform:"win32",manifest_platform:"win",arch:"x64"},
                  {runner:$linux_x64,platform:"linux",manifest_platform:"linux",arch:"x64"}
                ]}')"
              ;;
            *)
              echo "unsupported runner profile: ${RUNNER_PROFILE}" >&2
              exit 1
              ;;
          esac
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          if [[ "${RUNNER_PROFILE}" == standard-resume ]]; then
            prime_matrix="$(jq -c '{include:[.include[0] + {segment:1}, .include[0] + {segment:2}]}' <<< "${matrix}")"
          else
            prime_matrix="${matrix}"
          fi
          echo "prime_matrix=${prime_matrix}" >> "${GITHUB_OUTPUT}"

  prime:
    name: Prime cache ${{ matrix.platform }} ${{ matrix.arch }} segment ${{ matrix.segment }}
    if: github.event_name != 'push' && inputs.runner_profile == 'standard-resume' && inputs.target != 'all'
    needs: configure
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.configure.outputs.prime_matrix) }}
    env:
      GN_EXTRA_ARGS: 'symbol_level=0 override_electron_version="41.7.1" cc_wrapper="sccache"'
      SCCACHE_GHA_ENABLED: 'on'
      SCCACHE_GHA_VERSION: dimcode-electron-v41.7.1-${{ matrix.platform }}-${{ matrix.arch }}-8d918e182302681bf1e00d8f4b4c694467a89cf8

    steps:
      - name: Check out patched Electron
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          path: electron-root/src/electron

      - name: Assert fork ownership
        shell: bash
        run: test "${GITHUB_REPOSITORY}" = "eric8810/electron"

      - name: Free macOS disk space
        if: runner.os == 'macOS'
        uses: ./electron-root/src/electron/.github/actions/free-space-macos

      - name: Free Linux disk space
        if: runner.os == 'Linux'
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h

      - name: Configure build-tools Git settings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global branch.autosetuprebase always
          git config --global core.fscache true
          git config --global core.longpaths true
          git config --global core.preloadindex true

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 22.21.1

      - name: Install pinned Electron build tools
        shell: bash
        run: npm install --global @electron/build-tools

      - name: Install pinned sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0

      - name: Initialize release cache primer
        shell: bash
        run: |
          e init dimcode-prime-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.segment }} \
            --root="${GITHUB_WORKSPACE}/electron-root" \
            --import=release \
            --out=Release \
            --target-cpu="${{ matrix.arch }}" \
            --remote-build=none \
            --use-https \
            --fork="${GITHUB_REPOSITORY}" \
            --force
          e sync --no-history
          test "$(git -C "${GITHUB_WORKSPACE}/electron-root/src/electron" rev-parse HEAD)" = "${GITHUB_SHA}"
          git -C "${GITHUB_WORKSPACE}/electron-root/src/electron" pack-refs --all

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: sudo "${GITHUB_WORKSPACE}/electron-root/src/build/install-build-deps.sh" --no-prompt

      - name: Prime release compiler cache
        id: compile
        continue-on-error: true
        timeout-minutes: ${{ matrix.prime_minutes }}
        shell: bash
        run: e build --target electron:electron_dist_zip --no-remote

      - name: Require populated compiler cache
        if: always()
        shell: bash
        run: |
          stats="$(sccache --show-stats)"
          printf '%s\n' "${stats}"
          hits="$(awk '$1 == "Cache" && $2 == "hits" { print $3; exit }' <<< "${stats}")"
          misses="$(awk '$1 == "Cache" && $2 == "misses" { print $3; exit }' <<< "${stats}")"
          [[ "${hits}" =~ ^[0-9]+$ ]]
          [[ "${misses}" =~ ^[0-9]+$ ]]
          (( hits + misses >= 100 ))

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    if: always() && needs.configure.result == 'success' && (inputs.runner_profile != 'standard-resume' || inputs.target != 'all') && (needs.prime.result == 'success' || needs.prime.result == 'skipped')
    needs:
      - configure
      - prime
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    env:
      GN_EXTRA_ARGS: ${{ inputs.runner_profile == 'standard-resume' && 'symbol_level=0 override_electron_version="41.7.1" cc_wrapper="sccache"' || 'symbol_level=0 override_electron_version="41.7.1"' }}
      SCCACHE_GHA_ENABLED: ${{ inputs.runner_profile == 'standard-resume' && 'on' || 'off' }}
      SCCACHE_GHA_VERSION: dimcode-electron-v41.7.1-${{ matrix.platform }}-${{ matrix.arch }}-8d918e182302681bf1e00d8f4b4c694467a89cf8

    steps:
      - name: Check out patched Electron
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          path: electron-root/src/electron

      - name: Assert fork ownership
        shell: bash
        run: test "${GITHUB_REPOSITORY}" = "eric8810/electron"

      - name: Free macOS disk space
        if: runner.os == 'macOS'
        uses: ./electron-root/src/electron/.github/actions/free-space-macos

      - name: Free Linux disk space
        if: runner.os == 'Linux'
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h

      - name: Configure build-tools Git settings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global branch.autosetuprebase always
          git config --global core.fscache true
          git config --global core.longpaths true
          git config --global core.preloadindex true

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 22.21.1

      - name: Install pinned Electron build tools
        shell: bash
        run: npm install --global @electron/build-tools

      - name: Install pinned sccache
        if: inputs.runner_profile == 'standard-resume'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0

      - name: Initialize release build
        shell: bash
        run: |
          e init dimcode-prebuilt-${{ matrix.platform }}-${{ matrix.arch }} \
            --root="${GITHUB_WORKSPACE}/electron-root" \
            --import=release \
            --out=Release \
            --target-cpu="${{ matrix.arch }}" \
            --remote-build=none \
            --use-https \
            --fork="${GITHUB_REPOSITORY}" \
            --force
          e sync --no-history
          test "$(git -C "${GITHUB_WORKSPACE}/electron-root/src/electron" rev-parse HEAD)" = "${GITHUB_SHA}"
          git -C "${GITHUB_WORKSPACE}/electron-root/src/electron" pack-refs --all

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: sudo "${GITHUB_WORKSPACE}/electron-root/src/build/install-build-deps.sh" --no-prompt

      - name: Build release runtime and Node headers
        shell: bash
        run: |
          e build --target electron:electron_dist_zip --no-remote
          e build --target electron:node_headers --no-remote

      - name: Require resumed compiler cache hits
        if: inputs.runner_profile == 'standard-resume'
        shell: bash
        run: |
          stats="$(sccache --show-stats)"
          printf '%s\n' "${stats}"
          hits="$(awk '$1 == "Cache" && $2 == "hits" { print $3; exit }' <<< "${stats}")"
          [[ "${hits}" =~ ^[0-9]+$ ]]
          (( hits >= 100 ))

      - name: Prepare Windows Node import library
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/electron-root/src/out/Release/gen/node_headers/Release"
          cp "${GITHUB_WORKSPACE}/electron-root/src/out/Release/electron.lib" \
            "${GITHUB_WORKSPACE}/electron-root/src/out/Release/gen/node_headers/Release/node.lib"

      - name: Validate release runtime
        shell: bash
        run: |
          build_dir="${GITHUB_WORKSPACE}/electron-root/src/out/Release"
          python3 "${GITHUB_WORKSPACE}/electron-root/src/electron/script/zip_manifests/check-zip-manifest.py" \
            "${build_dir}/dist.zip" \
            "${GITHUB_WORKSPACE}/electron-root/src/electron/script/zip_manifests/dist_zip.${{ matrix.manifest_platform }}.${{ matrix.arch }}.manifest"
          case "${{ matrix.platform }}" in
            darwin) runtime="${build_dir}/Electron.app/Contents/MacOS/Electron" ;;
            linux) runtime="${build_dir}/electron" ;;
            win32) runtime="${build_dir}/electron.exe" ;;
            *) echo "unsupported platform: ${{ matrix.platform }}" >&2; exit 1 ;;
          esac
          test "$("${runtime}" --version)" = "v41.7.1"
          runtime_file="$(file "${runtime}")"
          case "${{ matrix.arch }}" in
            arm64) [[ "${runtime_file}" == *arm64* ]] ;;
            x64) [[ "${runtime_file}" == *x86_64* || "${runtime_file}" == *x86-64* || "${runtime_file}" == *PE32+* ]] ;;
            *) echo "unsupported architecture: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac

      - name: Run OSR wheel regression spec
        shell: bash
        working-directory: electron-root/src/electron
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            xvfb-run -a npm run test -- -g='retargets a wheel gesture after an unconsumed direction change'
          else
            npm run test -- -g='retargets a wheel gesture after an unconsumed direction change'
          fi

      - name: Prepare immutable prebuilt artifact
        shell: bash
        working-directory: electron-root/src/electron
        run: |
          node script/dimcode/prebuilt-release.mjs prepare \
            --build-dir "${GITHUB_WORKSPACE}/electron-root/src/out/Release" \
            --output-dir "${GITHUB_WORKSPACE}/prebuilt-output" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}"

      - name: Upload prebuilt artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dimcode-electron-${{ matrix.platform }}-${{ matrix.arch }}
          path: prebuilt-output
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  resume-linux-x64:
    name: Resume linux x64
    if: inputs.runner_profile == 'standard-resume' && inputs.target == 'all'
    needs: configure
    uses: ./.github/workflows/dimcode-prebuilt-target.yml
    with:
      runner: ubuntu-24.04
      platform: linux
      manifest_platform: linux
      arch: x64
      resume: true
      prime_minutes: 225
      cache_epoch: 8d918e182302681bf1e00d8f4b4c694467a89cf8
    permissions:
      contents: read

  resume-win32-x64:
    name: Resume win32 x64
    needs: resume-linux-x64
    uses: ./.github/workflows/dimcode-prebuilt-target.yml
    with:
      runner: windows-2022
      platform: win32
      manifest_platform: win
      arch: x64
      resume: true
      prime_minutes: 155
      cache_epoch: 8d918e182302681bf1e00d8f4b4c694467a89cf8
    permissions:
      contents: read

  resume-darwin-arm64:
    name: Resume darwin arm64
    needs: resume-win32-x64
    uses: ./.github/workflows/dimcode-prebuilt-target.yml
    with:
      runner: macos-15
      platform: darwin
      manifest_platform: mac
      arch: arm64
      resume: true
      prime_minutes: 205
      cache_epoch: 8d918e182302681bf1e00d8f4b4c694467a89cf8
    permissions:
      contents: read

  resume-darwin-x64:
    name: Resume darwin x64
    needs: resume-darwin-arm64
    uses: ./.github/workflows/dimcode-prebuilt-target.yml
    with:
      runner: macos-15-intel
      platform: darwin
      manifest_platform: mac
      arch: x64
      resume: true
      prime_minutes: 250
      cache_epoch: 8d918e182302681bf1e00d8f4b4c694467a89cf8
    permissions:
      contents: read

  assemble-resumed:
    name: Assemble resumed prebuilt bundle
    if: inputs.runner_profile == 'standard-resume' && inputs.target == 'all'
    needs: resume-darwin-x64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out release helper
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Download platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dimcode-electron-*
          path: release-input
          merge-multiple: false

      - name: Aggregate and verify release bundle
        shell: bash
        run: |
          node script/dimcode/prebuilt-release.mjs aggregate \
            --input-dir release-input \
            --output-dir release-output

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dimcode-electron-prebuilt-bundle
          path: release-output
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  assemble:
    name: Assemble prebuilt bundle
    if: inputs.runner_profile != 'standard-resume'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out release helper
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Download platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dimcode-electron-*
          path: release-input
          merge-multiple: false

      - name: Aggregate and verify release bundle
        shell: bash
        run: |
          node script/dimcode/prebuilt-release.mjs aggregate \
            --input-dir release-input \
            --output-dir release-output

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dimcode-electron-prebuilt-bundle
          path: release-output
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Create draft GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dimcode-v41.7.1-r')
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release helper
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dimcode-electron-prebuilt-bundle
          path: release-bundle

      - name: Reverify release bundle
        shell: bash
        run: node script/dimcode/prebuilt-release.mjs verify --input-dir release-bundle

      - name: Attest release bundle provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        with:
          subject-path: release-bundle/*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release-bundle/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes "DimCode custom Electron 41.7.1 runtime. Temporary bridge for electron/electron#52777; see build-manifest.json for immutable provenance."
